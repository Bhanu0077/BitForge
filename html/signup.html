<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signup • BitForge</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="auth-page">
    <main>
      <div class="auth">
        <div class="brand">Bit<span>Forge</span></div>
        <div class="card">
          <div class="eyebrow">Create Wallet</div>
          <h1>Join the network</h1>
          <p class="auth-sub">
            Create a simple account for the blockchain network.
          </p>
          <form
            onsubmit="
              event.preventDefault();
              saveUser();
            "
          >
            <label>Username</label
            ><input id="name" placeholder="Choose a username" required /><label
              >Password</label
            ><input type="password" placeholder="Password" required /><button
              class="btn"
            >
              Create Account
            </button>
          </form>
          <p class="auth-links">
            Already have one? <a class="accent" href="login.html">Login</a>
          </p>
        </div>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
