<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login • BitForge</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="auth-page">
    <main>
      <div class="auth">
        <div class="brand">Bit<span>Forge</span></div>
        <div class="card">
          <div class="eyebrow">Blockchain Lab</div>
          <h1>Welcome back</h1>
          <p class="auth-sub">Enter a username to open your BitForge wallet.</p>
          <form
            onsubmit="
              event.preventDefault();
              saveUser();
            "
          >
            <label>Username</label
            ><input id="name" placeholder="e.g. Bhanu" required /><button
              class="btn"
            >
              Enter BitForge
            </button>
          </form>
          <p class="auth-links">
            No account? <a class="accent" href="signup.html">Create one</a>
          </p>
          <div class="notice">Sign in with your BitForge username.</div>
        </div>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
