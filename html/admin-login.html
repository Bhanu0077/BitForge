<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge — Administrator sign in</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;padding:24px">
    <main class="card-panel" style="width:min(100%,400px)">
        <p class="eyebrow">Restricted area</p>
        <h2 style="margin-top:8px">Administrator sign in</h2>
        <p style="margin:8px 0 24px">Use the administrator credentials configured for this server.</p>
        <form id="adminLoginForm">
            <label for="adminUsername">Administrator username</label>
            <input id="adminUsername" autocomplete="username" required>
            <label for="adminPassword">Administrator password</label>
            <div class="input-group">
                <input id="adminPassword" type="password" autocomplete="current-password" required>
                <button type="button" class="eye-btn" aria-label="Show password" title="Show password" id="adminPasswordToggle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
            </div>
            <button type="submit" style="width:100%;margin-top:20px">Sign in</button>
        </form>
        <p id="adminMessage" role="alert" style="margin-top:14px"></p>
        <p style="margin-top:20px;font-size:12px"><a href="login.html" style="color:var(--text-secondary)">Return to wallet sign in</a></p>
    </main>
    <script>
        const api = window.location.origin + "/BitForge/api/admin";
        const eye = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
        const eyeOff = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.4 10.4 0 0 1 12 6c6.5 0 10 6 10 6a18.8 18.8 0 0 1-3.1 3.7M6.3 6.3C3.6 8.1 2 12 2 12s3.5 6 10 6a10.4 10.4 0 0 0 4.1-.8"/><circle cx="12" cy="12" r="2.5"/></svg>';
        document.getElementById("adminPasswordToggle").addEventListener("click", function () {
            const input = document.getElementById("adminPassword");
            const visible = input.type === "text";
            input.type = visible ? "password" : "text";
            this.innerHTML = visible ? eye : eyeOff;
            this.setAttribute("aria-label", visible ? "Show password" : "Hide password");
        });
        document.getElementById("adminLoginForm").addEventListener("submit", async event => {
            event.preventDefault();
            const message = document.getElementById("adminMessage");
            const body = new URLSearchParams({ username: adminUsername.value.trim(), password: adminPassword.value });
            try {
                const response = await fetch(api + "/login", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
                const data = await response.json();
                if (data.success) window.location.href = "admin.html";
                else { message.textContent = data.message || "Sign in failed."; message.className = "text-danger"; }
            } catch (_) { message.textContent = "Could not reach the server."; message.className = "text-danger"; }
        });
    </script>
</body>
</html>
