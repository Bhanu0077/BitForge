<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Transactions • BitForge</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <div class="container nav">
        <a class="brand" href="index.html">Bit<span>Forge</span></a>
        <nav>
          <a href="index.html">Dashboard</a><a href="wallet.html">Wallet</a
          ><a class="active" href="transactions.html">Transactions</a
          ><a href="mining.html">Mining</a
          ><a href="blockchain.html">Blockchain</a
          ><a href="network.html">Network</a>
        </nav>
        <div class="nav-user">
          <span class="avatar">B</span><span data-user>Bhanu</span>
        </div>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="hero">
          <div>
            <div class="eyebrow">Ledger</div>
            <h1>Transactions</h1>
            <p>Your locally stored transactions.</p>
          </div>
          <a class="btn" href="wallet.html">+ Send BFG</a>
        </section>
        <div class="card">
          <div class="card-title">
            <h2>Recent Activity</h2>
            <span class="small">Browser storage</span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>From</th>
                  <th>To</th>
                  <th>Amount</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="txBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <footer>BitForge • BitForge Blockchain</footer>
    <script src="../script.js"></script>
  </body>
</html>
