<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge | Login</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="brand dark-brand" href="index.html"><span class="brand-mark">BF</span><span><strong>BITFORGE</strong><small>Blockchain Simulation</small></span></a>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Login</h1>
    <p class="auth-text">Login to open your BitForge dashboard.</p>
    <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="student@example.com" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Enter password" required>
        <button class="primary-button" type="submit">Login</button>
    </form>
    <p class="switch-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    <a class="back-link" href="index.html">← Back to dashboard</a>
</div>
<script src="../script.js"></script>
</body>
</html>
