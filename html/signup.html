<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge | Sign Up</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="brand dark-brand" href="index.html"><span class="brand-mark">BF</span><span><strong>BITFORGE</strong><small>Blockchain Simulation</small></span></a>
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1>Sign Up</h1>
    <p class="auth-text">Create a demo account for the BitForge website.</p>
    <form id="signup-form">
        <label for="signup-name">Name</label>
        <input id="signup-name" type="text" placeholder="Your name" required>
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" placeholder="student@example.com" required>
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" placeholder="Create password" required>
        <button class="primary-button" type="submit">Create Account</button>
    </form>
    <p class="switch-text">Already have an account? <a href="login.html">Login</a></p>
    <a class="back-link" href="index.html">← Back to dashboard</a>
</div>
<script src="../script.js"></script>
</body>
</html>
