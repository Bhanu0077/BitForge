<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge - Recover Password</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-base);">
    <div style="background: var(--bg-surface); padding: 30px; border-radius: 12px; border: 1px solid var(--accent-primary); width: 90%; max-width: 400px; text-align: center;">
        <h2 style="color: var(--accent-primary); margin-bottom: 10px;">Reset Password</h2>
        <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px;">Verify secret answer to recover password</p>

        <form onsubmit="handleForgotPassword(event)">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Username</label>
                <input type="text" id="forgotUsername" required placeholder="Your username" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Secret Answer</label>
                <input type="text" id="forgotAnswer" required placeholder="Enter secret answer..." style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); margin-top: 5px;">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">New Password</label>
                <div class="input-group">
                    <input type="password" id="forgotNewPassword" required placeholder="••••••••" style="width: 100%; padding: 12px 40px 12px 12px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); margin-top: 5px;">
                    <button type="button" class="eye-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('forgotNewPassword', this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
                </div>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: var(--accent-primary); color: #ffffff; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem;">Update Password</button>
        </form>

        <div id="message" style="margin-top: 15px; font-size: 0.9rem; font-weight: bold;"></div>

        <div style="margin-top: 20px; font-size: 0.85rem;">
            <a href="login.html" style="color: var(--accent-primary); text-decoration: none;">Back to Login</a>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
