<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitForge - Mining Engine</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">
    <link rel="stylesheet" href="../style.css">
    <style>
        .hash-display { font-family: var(--font-mono); font-size: .9rem; color: #cbd5e1; background: #0d1422; padding: 15px; border-radius: 7px; word-break: break-all; margin: 20px 0; border: 1px solid var(--border-subtle); }
        .btn-mine { padding: 12px 18px; font-size: .9rem; }
        .btn-mine:hover { transform: translateY(-1px); }
        .btn-mine:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="transactions.html">Payments</a>
        <a href="mining.html" class="active">Mining</a>
        <a href="blockchain.html">Ledger</a>
        <a href="network.html">Network</a>
        <button onclick="logout()" style="background: var(--danger-red); padding: 5px 15px; border: none; cursor: pointer;">Logout</button>
    </nav>

    <div class="container" style="padding: 20px;">
        <h2 style="text-align: center;">BitForge Proof-of-Work Engine</h2>

        <div class="card-panel">
            <h3>Active Mining Node</h3>
            <p style="margin-top: 8px;">Miner Identity: <strong data-user style="color: var(--accent-primary);">Loading...</strong></p>
            <p style="margin-top: 4px;">Block Reward: <strong id="blockReward" style="color: var(--accent-emerald);">+50.00 BFG</strong></p>

            <div style="margin-top: 20px;" id="nonceBox">Current Nonce calculation: <span id="nonceVal">11010</span></div>

            <div class="hash-display" id="hashDisplay">
                00003447af942de333d71083107008ea4740124e4f70aa15b03a3c6889388988
            </div>

            <button class="btn-mine" id="mineBtn" onclick="executeProofOfWork()">Start Mining Block</button>

            <div id="message" style="margin-top: 20px; font-weight: bold;"></div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        async function executeProofOfWork() {
            const user = localStorage.getItem("bitforgeUser") || "test";
            const btn = document.getElementById("mineBtn");
            const hashBox = document.getElementById("hashDisplay");
            const nonceBox = document.getElementById("nonceVal");
            const msg = document.getElementById("message");

            btn.disabled = true;
            btn.textContent = "Calculating proof-of-work…";
            msg.textContent = "";

            const cores = navigator.hardwareConcurrency || 2;
            const memory = navigator.deviceMemory || 4;
            let gpuAvailable = false;
            try {
                const canvas = document.createElement("canvas");
                gpuAvailable = !!(window.WebGLRenderingContext && (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));
            } catch (ignored) {}

            let miningMs = 18000 - Math.min(8000, (cores - 2) * 650) - Math.min(3000, (memory - 4) * 350);
            if (gpuAvailable) miningMs -= 2500;
            miningMs = Math.round(miningMs * (0.78 + Math.random() * 0.44));
            miningMs = Math.max(5000, miningMs);

            let elapsed = 0;
            const interval = setInterval(() => {
                const randomNonce = Math.floor(Math.random() * 90000) + 10000;
                const fakeHash = "0000" + Array.from({length: 60}, () => Math.floor(Math.random()*16).toString(16)).join("");
                nonceBox.textContent = randomNonce;
                hashBox.textContent = fakeHash;
                elapsed += 100;

                if (elapsed >= miningMs) {
                    clearInterval(interval);
                    submitMinedBlock(user, cores, memory, gpuAvailable);
                }
            }, 100);
        }

        async function submitMinedBlock(user, cores, memory, gpuAvailable) {
            const btn = document.getElementById("mineBtn");
            try {
                const res = await fetch("/BitForge/api/mining", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `username=${encodeURIComponent(user)}&hardwareConcurrency=${encodeURIComponent(cores)}&deviceMemory=${encodeURIComponent(memory)}&gpuAvailable=${gpuAvailable}`
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById("hashDisplay").textContent = data.hash;
                    document.getElementById("nonceVal").textContent = data.nonce;
                    showMessage("" + data.message, false);
                    if (typeof showToast === "function") {
                        const reward = data.reward != null ? data.reward : 50;
                    document.getElementById("blockReward").textContent = `+${Number(reward).toFixed(2)} BFG`;
                    showToast(`Block successfully mined! +${Number(reward).toFixed(2)} BFG added to balance.`, "success");
                    localStorage.setItem("bitforgeLedgerUpdate", JSON.stringify({ blockIndex: data.block_index || null, mined: true }));
                    if (typeof fetchEcosystemData === "function") fetchEcosystemData();
                    }
                } else {
                    showMessage("" + data.message, true);
                }
            } catch (err) {
                showMessage("Connection to mining server failed.", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Start Mining Block";
            }
        }
    </script>
</body>
</html>
