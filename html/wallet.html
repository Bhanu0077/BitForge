<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wallet • BitForge</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <div class="container nav">
        <a class="brand" href="index.html">Bit<span>Forge</span></a>
        <nav>
          <a href="index.html">Dashboard</a
          ><a class="active" href="wallet.html">Wallet</a
          ><a href="transactions.html">Transactions</a
          ><a href="mining.html">Mining</a
          ><a href="blockchain.html">Blockchain</a
          ><a href="network.html">Network</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="hero">
          <div>
            <div class="eyebrow">Wallet</div>
            <h1>Send BFG</h1>
            <p>Create a transaction in the browser activity.</p>
          </div>
        </section>
        <div class="grid two">
          <div class="card">
            <div class="card-title">
              <h2>New Transaction</h2>
              <span class="badge">Available</span>
            </div>
            <form onsubmit="sendCoins(event)">
              <label>Receiver username</label
              ><input id="receiver" placeholder="e.g. Rahul" required /><label
                >Amount</label
              ><input
                id="amount"
                type="number"
                min="1"
                placeholder="100"
                required
              /><button class="btn">Create Transaction</button>
            </form>
            <div id="message"></div>
          </div>
          <div class="card center">
            <div class="eyebrow">Your wallet</div>
            <h2><span data-user>Bhanu</span>'s Address</h2>
            <div class="qr"></div>
            <div class="wallet-address">BFG1DEMOUSER7X92KQ</div>
            <div class="stat">
              <span>Balance</span><strong>2,450 BFG</strong>
            </div>
            <div class="stat">
              <span>Status</span><strong class="good">Active</strong>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>BitForge • BitForge Blockchain</footer>
    <script src="../script.js"></script>
  </body>
</html>
